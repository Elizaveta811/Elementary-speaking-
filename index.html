<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Time zones – interactive lesson</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f3ef;
    }
    .card {
      max-width: 1000px;
      margin: 0 auto 1.5rem;
      background: #ffffff;
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
    }
    h1 {
      margin-top: 0;
    }
    .subtitle {
      color: #555;
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin: .5rem 0 1rem;
    }
    .chip {
      padding: .3rem .7rem;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: #f7f6f2;
      font-size: 0.9rem;
    }

    /* Guided practice */
    .gp-question {
      font-weight: 600;
      margin-bottom: .5rem;
    }
    #gpClock {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin-bottom: .75rem;
    }
    .gp-clock-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid #01696f;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #01696f;
      background: #ffffff;
    }
    .gp-clock-caption {
      font-size: 0.85rem;
      color: #555;
    }
    .gp-options {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: .75rem;
    }
    .gp-option {
      padding: .6rem 1.1rem;
      border-radius: .8rem;
      border: 1px solid #ccc;
      background: #faf9f6;
      cursor: pointer;
      font-weight: 500;
      transition: background 150ms ease, border-color 150ms ease, transform 120ms ease, color 150ms ease;
    }
    .gp-option:hover {
      transform: translateY(-1px);
      border-color: #01696f;
    }
    .gp-option.selected {
      background: #ffe6c2;
      border-color: #cc7a00;
      color: #5b3800;
    }
    .gp-option.correct {
      background: #e0f5e0;
      border-color: #3c8a3c;
      color: #184218;
    }
    .gp-option.wrong {
      background: #f9d7cf;
      border-color: #c1522c;
      color: #5c2416;
    }
    .gp-feedback {
      font-size: 0.9rem;
      color: #555;
      min-height: 1.4rem;
    }

    /* Main game */
    .game-header {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #555;
    }
    .game-main {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      gap: 1.25rem;
    }
    .prompt {
      font-weight: 600;
      margin-bottom: .3rem;
    }
    .family {
      font-size: 0.9rem;
      color: #555;
      margin-bottom: .75rem;
    }
    .output {
      min-height: 2rem;
      padding: .5rem .75rem;
      border-radius: .5rem;
      background: #f1eee9;
      margin-bottom: .75rem;
    }
    .chips-selectable {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
      margin-bottom: 1rem;
    }
    .chip-selectable {
      padding: .4rem .7rem;
      border-radius: 999px;
      border: 1px solid #ccc;
      background: #f7f6f2;
      cursor: pointer;
      user-select: none;
      font-size: 0.95rem;
      transition: background 150ms ease, border-color 150ms ease;
    }
    .chip-selectable.selected {
      background: #01696f;
      color: #fff;
      border-color: #01696f;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-bottom: .5rem;
    }
    button {
      padding: .5rem .9rem;
      border-radius: .6rem;
      border: 1px solid #01696f;
      background: #01696f;
      color: #fff;
      cursor: pointer;
      font-size: 0.95rem;
    }
    button.secondary {
      border-color: #aaa;
      background: #fff;
      color: #333;
    }
    .game-feedback {
      font-size: 0.9rem;
      color: #555;
      min-height: 1.4rem;
    }

    /* Right column – speaking prompts */
    .speaking-title {
      font-weight: 600;
      margin-bottom: .5rem;
    }
    .speaking-list {
      font-size: 0.9rem;
      color: #555;
      padding-left: 1rem;
    }
    .speaking-list li {
      margin-bottom: .2rem;
    }

    @media (max-width: 800px) {
      .game-main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- INTRO CARD -->
  <div class="card" id="introCard"></div>

  <!-- GUIDED PRACTICE -->
  <div class="card">
    <div class="gp-question" id="gpQuestion"></div>
    <div id="gpClock"></div>
    <div class="gp-options" id="gpOptions"></div>
    <div class="gp-feedback" id="gpFeedback"></div>
  </div>

  <!-- MAIN GAME -->
  <div class="card">
    <div class="game-header">
      <span id="gameTitle"></span>
      <span id="gameFunction"></span>
      <span id="gameRound"></span>
    </div>

    <div class="game-main">
      <!-- left: interactive task -->
      <div>
        <div class="prompt" id="mainPrompt"></div>
        <div class="family" id="mainContext"></div>

        <div class="chips-selectable" id="gameChunks"></div>
        <div class="output" id="gameOutput"></div>

        <div class="controls">
          <button id="btnCheck">Check</button>
          <button class="secondary" id="btnClear">Clear</button>
          <button class="secondary" id="btnNext">Next</button>
          <button class="secondary" id="btnShow">Show model</button>
        </div>
        <div class="game-feedback" id="gameFeedback"></div>
      </div>

      <!-- right: speaking prompts -->
      <div>
        <div class="speaking-title">Speaking prompts</div>
        <ul class="speaking-list" id="speakingList"></ul>
      </div>
    </div>
  </div>

  <script>
    /* ========= 1. КОНФИГ: данные для Time zones ========= */

    const lessonMeta = {
      title: "Time zones – What's the time?",
      type: "Type of activity: small groups · information gap",
      func: "Function: asking and telling the time",
      exponents: [
        "What's the time?",
        "What time is it in ...?",
        "It's ... (o'clock / half past ...)"
      ],
      lexical: "Lexical area: numbers, times; cities (Tokyo, Sydney, London, New York, Rio)",
      essentialVocab: [
        "Tokyo", "Sydney", "London", "New York", "Rio",
        "o'clock", "half past", "quarter to", "quarter past"
      ]
    };

    // Guided practice: каждая задача с вопросом, вариантами и «картинкой» часов
    const guidedPracticeItems = [
      {
        question: "It's 4:00 in Sydney. What time is it in London?",
        options: ["2:00", "6:00", "10:00"],
        correctIndex: 1,
        correctFeedback: "Yes. London is ten hours behind Sydney.",
        wrongFeedback: "Not quite. Remember: London is ten hours behind Sydney.",
        clock: "4:00 Sydney"
      },
      {
        question: "It's 6:00 in Tokyo. What time is it in Sydney?",
        options: ["5:00", "7:00", "9:00"],
        correctIndex: 1,
        correctFeedback: "Right. Sydney is one hour ahead of Tokyo.",
        wrongFeedback: "Check the rule: Sydney is one hour ahead of Tokyo.",
        clock: "6:00 Tokyo"
      }
    ];

    // Основная игра: word order для вопросов о времени
    const gameItems = [
      {
        context: "Tokyo 6:00; Sydney is one hour ahead; London is ten hours behind Sydney.",
        target: "What time is it in London?",
        chunks: ["What", "time", "is it", "in London?"]
      },
      {
        context: "Sydney 4:00; London is ten hours behind Sydney.",
        target: "What time is it in London?",
        chunks: ["What", "time", "is it", "in London?"]
      },
      {
        context: "London 9:00; New York is five hours behind London.",
        target: "What time is it in New York?",
        chunks: ["What", "time", "is it", "in New York?"]
      }
    ];

    const speakingPrompts = [
      "Ask your partner: What time is it in Moscow?",
      "Ask: What time is it in Tokyo / Sydney now?",
      "Compare two cities: Where is it earlier / later?",
      "Ask and answer 3 real time questions with your classmate."
    ];

    /* ========= 2. РЕНДЕР ИНТРО ========= */

    function renderIntro() {
      const el = document.getElementById("introCard");
      el.innerHTML = `
        <h1>${lessonMeta.title}</h1>
        <div class="subtitle">${lessonMeta.type}</div>
        <div class="subtitle">${lessonMeta.func}</div>
        <div><strong>Exponents:</strong> ${lessonMeta.exponents.join("; ")}</div>
        <div style="margin-top:.4rem;"><strong>Lexical area:</strong> ${lessonMeta.lexical}</div>
        <div style="margin-top:.5rem;"><strong>Essential vocabulary:</strong></div>
        <div class="chips">
          ${lessonMeta.essentialVocab.map(v => `<span class="chip">${v}</span>`).join("")}
        </div>
      `;
    }

    /* ========= 3. GUIDED PRACTICE ========= */

    let gpIndex = 0;

    function renderGuidedPractice() {
      const item = guidedPracticeItems[gpIndex];
      document.getElementById("gpQuestion").textContent = item.question;

      // визуальные часы
      const clockBox = document.getElementById("gpClock");
      const timeText = item.clock.split(" ")[0]; // например "4:00"
      clockBox.innerHTML = `
        <div class="gp-clock-img">${timeText}</div>
        <div class="gp-clock-caption">${item.clock}</div>
      `;

      const box = document.getElementById("gpOptions");
      box.innerHTML = "";
      const feedback = document.getElementById("gpFeedback");
      feedback.textContent = "";

      item.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.className = "gp-option";
        btn.textContent = opt;
        btn.onclick = () => {
          // снять предыдущую подсветку
          [...box.querySelectorAll(".gp-option")].forEach(b => {
            b.classList.remove("selected", "correct", "wrong");
          });
          // показать выбранную
          btn.classList.add("selected");

          // сразу проверяем
          if (i === item.correctIndex) {
            btn.classList.remove("selected");
            btn.classList.add("correct");
            feedback.textContent = item.correctFeedback;
          } else {
            btn.classList.remove("selected");
            btn.classList.add("wrong");
            feedback.textContent = item.wrongFeedback;
          }
        };
        box.appendChild(btn);
      });
    }

    /* ========= 4. MAIN GAME – WORD ORDER ========= */

    let gameIndex = 0;

    function renderGame() {
      const item = gameItems[gameIndex];
      document.getElementById("gameTitle").textContent = lessonMeta.title;
      document.getElementById("gameFunction").textContent = lessonMeta.func;
      document.getElementById("gameRound").textContent =
        `Round ${gameIndex + 1} of ${gameItems.length}`;

      document.getElementById("mainPrompt").textContent =
        "Reorder the chunks to make a correct question about the time.";
      document.getElementById("mainContext").textContent = item.context;

      const chunksBox = document.getElementById("gameChunks");
      const output = document.getElementById("gameOutput");
      const feedback = document.getElementById("gameFeedback");
      chunksBox.innerHTML = "";
      output.textContent = "";
      feedback.textContent = "";

      let selected = [];

      item.chunks.forEach(chunk => {
        const span = document.createElement("span");
        span.className = "chip-selectable";
        span.textContent = chunk;
        span.onclick = () => {
          if (span.classList.contains("selected")) return;
          span.classList.add("selected");
          selected.push(chunk);
          output.textContent = selected.join(" ");
          feedback.textContent = "";
        };
        chunksBox.appendChild(span);
      });

      document.getElementById("btnCheck").onclick = () => {
        const attempt = output.textContent.trim();
        if (!attempt) {
          feedback.textContent = "First build your question by clicking the chunks.";
          return;
        }
        if (attempt === item.target) {
          feedback.textContent = "Correct word order. Now ask and answer this question aloud.";
        } else {
          feedback.textContent =
            "Not quite. Check the position of the wh-word, auxiliary, subject and main verb.";
        }
      };

      document.getElementById("btnClear").onclick = () => {
        selected = [];
        output.textContent = "";
        feedback.textContent = "";
        chunksBox.querySelectorAll(".chip-selectable").forEach(c => {
          c.classList.remove("selected");
        });
      };

      document.getElementById("btnNext").onclick = () => {
        gameIndex = (gameIndex + 1) % gameItems.length;
        renderGame();
      };

      document.getElementById("btnShow").onclick = () => {
        feedback.textContent = "Model question: " + item.target;
      };
    }

    /* ========= 5. SPEAKING PROMPTS ========= */

    function renderSpeaking() {
      const ul = document.getElementById("speakingList");
      ul.innerHTML = speakingPrompts
        .map(p => `<li>${p}</li>`)
        .join("");
    }

    /* ========= 6. INIT ========= */

    renderIntro();
    renderGuidedPractice();
    renderGame();
    renderSpeaking();
  </script>
</body>
</html>
